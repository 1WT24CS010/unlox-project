<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css"
</head>
<body>
    <div class="container">
        <header>
            <h1>My Expense Tracker</h1>
            <h3>Track your monthly spending</h3>
        </header>
        <div class="cards">
            <div class="card">Total Spent<br>Rs.5500</div>
            <div class="card">Highest Category<br>Food</div>
            <div class="card">Current Month<br>April</div>
        </div>
        <div class="categories">
            <h2>Expense Categories</h2>
            <div class="row">
                <span>Food</span>
                <span>Rs.2000</span>
            </div>
            <div class="row">
                <span>Transport</span>
                <span>Rs.800</span>
            </div>
            <div class="row">
                <span>Shopping</span>
                <span>Rs.1700</span>
            </div>
            <div class="row">
                <span>Entertainment</span>
                <span>Rs.1000</span>
            </div>
        </div>
        <div class="transactions">
            <h2>Recent Transactions</h2>
            <div class="txn">
                <p>Bought groceries</p>
                <span>10 April  -  Rs.500</span>
            </div>
            <div class="txn">
                <p>Movie</p>
                <span>12 April  -  Rs.300</span>
            </div>
        </div>
    </div>
</body>
</html>
